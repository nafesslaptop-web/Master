<style>
*{box-sizing:border-box;}
body{
margin:0;
font-family:system-ui;
background:linear-gradient(135deg,#020617,#0f172a,#1e1b4b);
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

/* Loader */
.loader{
position:fixed;
width:100%;
height:100%;
background:#020617;
display:flex;
justify-content:center;
align-items:center;
z-index:999;
}
.loader span{
width:45px;
height:45px;
border:4px solid #7c3aed;
border-top:4px solid transparent;
border-radius:50%;
animation:spin 1s linear infinite;
}
@keyframes spin{
100%{transform:rotate(360deg);}
}

/* Container */
.container{
width:92%;
max-width:400px;
background:rgba(255,255,255,0.03);
backdrop-filter:blur(10px);
border:1px solid rgba(124,58,237,0.3);
border-radius:25px;
padding:25px 20px;
text-align:center;
box-shadow:0 0 25px rgba(124,58,237,0.2);
opacity:0;
transform:translateY(20px);
transition:0.5s;
}
.show{
opacity:1;
transform:translateY(0);
}

/* Logo */
.logo{
width:100px;
height:100px;
border-radius:50%;
overflow:hidden;
margin:auto;
border:2px solid #7c3aed;
box-shadow:0 0 15px #7c3aed;
}
.logo img{
width:100%;
height:100%;
object-fit:cover;
}

/* Heading */
h1{
font-size:20px;
margin:15px 0 5px;
}
.sub{
font-size:13px;
color:#bbb;
margin-bottom:15px;
}

/* Features */
.features{
text-align:left;
font-size:14px;
margin-top:10px;
}
.features div{
padding:10px;
margin-bottom:8px;
background:rgba(255,255,255,0.04);
border-radius:10px;
}

/* CTA */
.btn{
margin-top:18px;
width:100%;
padding:14px;
border:none;
border-radius:40px;
background:linear-gradient(90deg,#7c3aed,#22d3ee);
color:white;
font-size:15px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}
.btn:hover{
opacity:0.9;
}

/* Footer */
.footer{
font-size:10px;
color:#777;
margin-top:15px;
}
</style>
