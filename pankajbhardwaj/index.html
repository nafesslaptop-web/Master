<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pankaj Bhardwaj</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#0d0d0d;
    color:#fff;
}

.container{
    width:95%;
    max-width:500px;
    margin:20px auto;
    border:1px solid #2a3550;
    border-radius:20px;
    padding:30px 20px;
    text-align:center;
    background:#111;
}

/* Logo Image */

.logo{
    width:140px;
    height:140px;
    margin:auto;
}

.logo img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:50%;
    border:4px solid #d9b15c;
    display:block;
}

.small{
    margin-top:25px;
    font-size:15px;
    letter-spacing:1px;
}

h1{
    margin-top:15px;
    font-size:44px;
    font-weight:700;
    line-height:1.1;
}

.telegram-btn{
    display:block;
    width:100%;
    text-decoration:none;
    margin:30px auto;
    background:linear-gradient(90deg,#7b1cff,#a000ff);
    color:#fff;
    padding:22px;
    font-size:22px;
    font-weight:700;
    border:2px solid #fff;
    border-radius:4px;
    position:relative;
    overflow:hidden;
    transition:.3s;
    animation:pulse 2s infinite;
}

.telegram-btn:hover{
    transform:scale(1.03);
}

.telegram-btn::before{
    content:"";
    position:absolute;
    top:0;
    left:-100%;
    width:60%;
    height:100%;
    background:rgba(255,255,255,.25);
    transform:skewX(-25deg);
    animation:shine 3s infinite;
}

@keyframes shine{
    100%{
        left:150%;
    }
}

@keyframes pulse{
    0%{
        box-shadow:0 0 0 0 rgba(145,0,255,.8);
    }
    70%{
        box-shadow:0 0 0 20px rgba(145,0,255,0);
    }
    100%{
        box-shadow:0 0 0 0 rgba(145,0,255,0);
    }
}

.features{
    margin-top:10px;
    line-height:1.6;
    font-size:18px;
    font-weight:600;
}

.bottom{
    margin-top:10px;
    font-size:16px;
}

@media(max-width:480px){

    h1{
        font-size:34px;
    }

    .telegram-btn{
        font-size:18px;
        padding:18px;
    }

    .features{
        font-size:16px;
    }

    .logo{
        width:120px;
        height:120px;
    }
}

</style>

</head>
<body>

<div class="container">

    <!-- Logo Image -->
    <div class="logo">
        <img src="https://github.com/nafesslaptop-web/pnkj/releases/download/pnkj/pnk.jpg" alt="Logo">
    </div>

    <div class="small">INDIA'S BEST CHANNEL</div>

    <h1>PANKAJ BHARDWAJ</h1>

    <a id="joinBtn"
       class="telegram-btn"
       href="https://t.me/yourchannel"
       target="_blank">
       JOIN NOW FREE TELEGRAM
    </a>

    <div class="features">
        INDIA'S MOST TRUSTED TELEGRAM CHANNEL<br><br>

        HIGH-ACCURACY BUY & SELL TRADES<br>

        EXPERT RISK-MANAGED ANALYSIS<br>

        LIVE MARKET UPDATES ON NEW TRADE SETUPS
    </div>

    <a id="joinBtn2"
       class="telegram-btn"
       href="https://t.me/yourchannel"
       target="_blank">
       JOIN NOW FREE TELEGRAM
    </a>

    <div class="bottom">
        Daily 5-6 Free Trade Setups ke liye free Telegram channel join karein.
    </div>

</div>

<script>

function telegramOutbound(){

    if(typeof fbq !== 'undefined'){
        fbq('trackCustom','TelegramOutbound',{
            destination:'telegram'
        });
    }

}

document.getElementById('joinBtn')
.addEventListener('click', telegramOutbound);

document.getElementById('joinBtn2')
.addEventListener('click', telegramOutbound);

</script>
