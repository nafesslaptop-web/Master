<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Telegram...</title>
    <meta http-equiv="refresh" content="0; url=tg://resolve?domain=YOUR_CHANNEL_USERNAME">
    
    <style>
        body { font-family: -apple-system, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .loader-box { text-align: center; background: white; padding: 30px; border-radius: 20px; shadow: 0 4px 10px rgba(0,0,0,0.1); width: 80%; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #0088cc; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        p { color: #555; font-size: 16px; margin: 0; }
    </style>
</head>
<body>
    <div class="loader-box">
        <div class="spinner"></div>
        <p>Connecting to <b>Official Telegram</b>...</p>
        <p style="font-size: 12px; color: #999; margin-top: 10px;">Opening App Safely</p>
    </div>

    <script>
        // JavaScript trigger (Backup)
        window.location.href = "tg://resolve?domain=+m5lEKBEyiZE1NmE1";

        // Agar 2 second tak app nahi khuli (browser ne roka), to direct link par bhej do
        setTimeout(function() {
            window.location.href = "https://t.me/+m5lEKBEyiZE1NmE1";
        }, 2000);
    </script>
</body>
</html>
